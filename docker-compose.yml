services:
  mongodb:
    image: mongo:7
    container_name: graylog-mongodb
    restart: unless-stopped
    volumes:
      - mongodb_data:/data/db

  opensearch:
    image: opensearchproject/opensearch:2.15.0
    container_name: graylog-opensearch
    environment:
      - discovery.type=single-node
      - plugins.security.disabled=true
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=OpenSearch@12345!
      - OPENSEARCH_JAVA_OPTS=-Xms1g -Xmx1g
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - opensearch_data:/usr/share/opensearch/data
    ports:
      - "9200:9200"
    restart: unless-stopped

  greylog:
    image: graylog/graylog:6.1
    container_name: greylog
    depends_on:
      - mongodb
      - opensearch
    environment:
      - GRAYLOG_PASSWORD_SECRET=${GRAYLOG_PASSWORD_SECRET}
      - GRAYLOG_ROOT_PASSWORD_SHA2=${GRAYLOG_ROOT_PASSWORD_SHA2}
      - GRAYLOG_HTTP_EXTERNAL_URI=${GRAYLOG_HTTP_EXTERNAL_URI}
      - GRAYLOG_MONGODB_URI=mongodb://mongodb:27017/graylog
      - GRAYLOG_OPENSEARCH_HOSTS=http://opensearch:9200
      - GRAYLOG_ELASTICSEARCH_HOSTS=http://opensearch:9200
    ports:
      - "9000:9000"
      - "1514:1514"
      - "1514:1514/udp"
      - "12201:12201"
      - "12201:12201/udp"
    restart: unless-stopped

  log-automation:
    build: ./automation
    container_name: greylog-log-automation
    depends_on:
      - greylog
    environment:
      # IMPORTANT: inside docker, use the service name (greylog), not localhost
      - GRAYLOG_URL=http://greylog:9000
      - GRAYLOG_API_TOKEN=${GRAYLOG_API_TOKEN}

      # Change this later to target streams, e.g. "stream:ssh" or "event_type:failed_login"
      - GRAYLOG_QUERY=*

      - POLL_SECONDS=30
      - BATCH_LIMIT=500
      - OUT_DIR=/out
      - CHECKPOINT_FILE=/out/checkpoint.json

      # keep true since you're using http. If you switch to https self-signed, set false.
      - GRAYLOG_VERIFY_TLS=true
    volumes:
      - ./out:/out
    restart: unless-stopped

volumes:
  mongodb_data:
  opensearch_data:
